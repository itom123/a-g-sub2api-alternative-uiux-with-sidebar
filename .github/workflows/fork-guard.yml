name: Fork guard

# Fails a PR (e.g. an upstream sync) that drops or overrides a fork customization.
# See docs/fork/CUSTOMIZATIONS.md and docs/fork/UPSTREAM_SYNC.md.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  fork-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Run fork guard
        run: bash tools/fork-guard.sh
